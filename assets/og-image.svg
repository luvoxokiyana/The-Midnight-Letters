<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Midnight Letters</title>
  <desc id="desc">An antique parchment and midnight-brown social sharing image featuring a gold Greek phi symbol and the title The Midnight Letters.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302217"/>
      <stop offset=".52" stop-color="#493322"/>
      <stop offset="1" stop-color="#21170f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#92704a" stop-opacity=".24"/>
      <stop offset="1" stop-color="#1c130d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead5a6"/>
      <stop offset=".5" stop-color="#c7a66f"/>
      <stop offset="1" stop-color="#98764a"/>
    </linearGradient>
    <pattern id="grain" width="180" height="180" patternUnits="userSpaceOnUse">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/>
      </filter>
      <rect width="180" height="180" filter="url(#noise)" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grain)" opacity=".28"/>

  <!-- Fine double-line frame -->
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#c5a574" stroke-opacity=".72" stroke-width="1.5"/>
  <rect x="45" y="45" width="1110" height="540" fill="none" stroke="#c5a574" stroke-opacity=".3" stroke-width="1"/>

  <!-- Restrained ornamental corners -->
  <g fill="none" stroke="#c5a574" stroke-opacity=".7" stroke-width="1.5">
    <path d="M65 105V65h40 M1095 65h40v40 M65 525v40h40 M1095 565h40v-40"/>
    <path d="M76 105V76h29 M1095 76h29v29 M76 525v29h29 M1095 554h29v-29"/>
  </g>

  <!-- Central emblem -->
  <circle cx="600" cy="190" r="73" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity=".85"/>
  <circle cx="600" cy="190" r="64" fill="none" stroke="#c5a574" stroke-opacity=".35" stroke-width="1"/>
  <text x="600" y="219" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="91" fill="url(#gold)">Φ</text>

  <path d="M430 310H770" stroke="#c5a574" stroke-opacity=".65" stroke-width="1"/>
  <path d="M570 310l30 -9 30 9 -30 9z" fill="#c5a574" opacity=".9"/>

  <text x="600" y="390" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="67" letter-spacing="2.5" fill="#eee4d1">The Midnight Letters</text>
  <text x="600" y="445" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic" letter-spacing="2" fill="#cbb792">A correspondence with the quieter hours.</text>

  <path d="M490 500H710" stroke="#c5a574" stroke-opacity=".45" stroke-width="1"/>
  <text x="600" y="535" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="5" fill="#b79a70">M.</text>
</svg>